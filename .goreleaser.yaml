version: 2

project_name: proximo

builds:
  - id: proximo
    main: .
    binary: proximo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/filippolmt/proximo/internal/version.Version={{ .Version }}
      - -X github.com/filippolmt/proximo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/filippolmt/proximo/internal/version.Date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: proximo
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew cask (not the deprecated `brews` formula). GoReleaser emits an
# `on_linux` url block and no `depends_on macos:`, so Linuxbrew installs it too
# — every step below that is macOS-only has to say so itself.
homebrew_casks:
  - name: proximo
    repository:
      owner: filippolmt
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/filippolmt/proximo"
    description: "Local development reverse proxy with automatic DNS and trusted HTTPS"
    # Converging the stack is the caveat's job, not the cask's: a steps block
    # runs under a sandbox with a throwaway $HOME, so `proximo update` would
    # neither reach Docker Desktop's socket (a symlink into the real
    # `~/.docker`) nor refresh the Skill copies it finds under the real home.
    # A step that silently does nothing is worse than one that is not there.
    caveats: |
      Run `proximo update` after upgrading: it converges the running stack to
      this CLI version and refreshes the agent Skill. It never needs sudo, and
      `proximo up` converges the stack too if you would rather just restart.
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    # Shell completions, emitted at install time by the staged binary itself —
    # cobra's own `completion` command, so nothing here can drift from the
    # command surface. The default shells (bash, zsh, fish) are all cobra
    # generates without an argument it would reject.
    generate_completions_from_executable:
      args:
        - completion
    # `preflight_steps`, not the `preflight do ... end` block that
    # `hooks.pre.install` is the only way to emit — Homebrew deprecated it and
    # warns on every `brew` command that loads the tap. No GoReleaser field
    # emits the new stanza, so it goes through `custom_block`, verbatim.
    # `{{staged_path}}` is a Homebrew install-time token and must survive
    # GoReleaser's own templating, hence the escaping.
    custom_block: |
      preflight_steps do
        # The binary is unsigned; strip the quarantine attribute so macOS
        # Gatekeeper does not refuse to run it with an "is damaged" alert.
        #
        # It has to be *pre*flight: `generate_completions_from_executable`
        # runs the staged binary, and Gatekeeper kills a quarantined one
        # before it can emit a single completion script. Homebrew orders cask
        # artifacts by class, not by position in the file — `PreflightSteps`
        # is first in that order, `GeneratedCompletion` near the last — so
        # this stanza holds the constraint and `postflight_steps` would break
        # it.
        #
        # `on_macos` is the declarative `if OS.mac?`, and it is not optional:
        # under Linuxbrew a `run` that cannot find `/usr/bin/xattr` defaults
        # to `must_succeed: true` and fails the install instead of doing
        # nothing.
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/proximo"]
        end
      end
