version: 2

project_name: proximo

builds:
  - id: proximo
    main: .
    binary: proximo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/filippolmt/proximo/internal/version.Version={{ .Version }}
      - -X github.com/filippolmt/proximo/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/filippolmt/proximo/internal/version.Date={{ .Date }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: proximo
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew cask (not the deprecated `brews` formula), macOS-only.
homebrew_casks:
  - name: proximo
    repository:
      owner: filippolmt
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/filippolmt/proximo"
    description: "Local development reverse proxy with automatic DNS and trusted HTTPS"
    # The stack is no longer built on the host, so the hook below converges it
    # itself: what used to be heavy work Homebrew discourages is now a pull.
    # The caveat covers the one case the hook cannot: Docker down at upgrade time.
    caveats: |
      The running stack is converged to this CLI version on install. If Docker
      was not running, it converges on the next `proximo up` — or run
      `proximo update` yourself; it never needs sudo.
    hooks:
      post:
        install: |
          # The binary is unsigned; strip the quarantine attribute so macOS
          # Gatekeeper does not refuse to run it with an "is damaged" alert.
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/proximo"]
          end
          # `proximo update` is a soft no-op that exits 0 when Docker is
          # unreachable or no stack is running, so it is safe in a hook. It is
          # not allowed to fail the upgrade either way: a stack that cannot
          # converge now converges on the next `proximo up`.
          system_command "#{staged_path}/proximo", args: ["update"],
                         must_succeed: false, print_stdout: true
