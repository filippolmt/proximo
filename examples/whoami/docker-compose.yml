# Sample stack for the end-to-end test.
#
#   proximo install                         # one-time host setup
#   docker compose up -d                    # from this directory (or: make demo)
#   open https://whoami.test
#
# Proximo-native routing: declare the host(s) with `proximo.hosts` and you are
# routed at https://whoami.test. The backend port is auto-detected because the
# image EXPOSEs exactly one port; set `proximo.port` only when it exposes zero
# or several. `proximo.enable=false` would park the container without deleting
# labels.
name: proximo-demo

services:
  # Baseline: no healthcheck → routed as soon as it is running (unchanged by the
  # health-gating feature).
  whoami:
    image: traefik/whoami
    container_name: whoami
    labels:
      - "proximo.hosts=whoami.test"

  # Health gating: a container with a slow boot. The healthcheck only passes once
  # nginx is actually serving, so proximo withholds the route while the container
  # is `starting` and publishes it only once `healthy`. `proximo status` lists it
  # as `starting (waiting for healthy)` during the ~25s warmup, then as routed —
  # no 502/503 window. (whoami is a scratch image with no shell, so this demo
  # uses nginx:alpine, whose busybox `wget` can run the healthcheck.)
  slow:
    image: nginx:alpine
    container_name: slow
    command: ["sh", "-c", "sleep 25 && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 2s
      retries: 20
    labels:
      - "proximo.hosts=slow.test"

  # Opt-out: same slow boot, but `proximo.health=false` makes proximo ignore the
  # healthcheck and route on running — so https://slow-optout.test 502s until
  # nginx comes up. Use this when a healthcheck is stricter than "can serve HTTP".
  slow-optout:
    image: nginx:alpine
    container_name: slow-optout
    command: ["sh", "-c", "sleep 25 && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 2s
      retries: 20
    labels:
      - "proximo.hosts=slow-optout.test"
      - "proximo.health=false"

  # Transcript: no proximo.inspect, on purpose. Every route produces an Exchange
  # because Traefik records an access log, so this container is diagnosable with
  # no label and no browser — `curl` a 500 out of it and read what it wrote.
  # nginx logs to stdout, so /boom leaves a line the Transcript quotes back.
  failing:
    image: nginx:alpine
    container_name: failing
    command:
      - sh
      - -c
      - |
        printf 'server { listen 80; location /boom { return 500 "boom\n"; } location / { return 200 "ok\n"; } }' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    labels:
      - "proximo.hosts=failing.test"

  # Incidents: no host, no route, no browser — a worker. `proximo.transcript`
  # makes it *known* to proximo without routing it, so what the runtime declares
  # about it is recorded: this one writes a few lines, exits 1, and is restarted
  # twice, which is three Incidents and a Transcript window per container
  # lifetime. `proximo errors --service worker` reads them.
  worker:
    image: alpine:3
    container_name: worker
    restart: on-failure:2
    command:
      - sh
      - -c
      - |
        echo "worker: picked up job 41871"
        echo "worker: connecting to the queue"
        echo "worker: panic: assignment to entry in nil map" >&2
        exit 1
    labels:
      - "proximo.transcript=true"

  # The stuck worker. proximo cannot tell an idle consumer from a blocked one by
  # looking — that needs to know whether work was waiting, which only the project
  # knows. A Docker healthcheck is how the project says it: this one advances for
  # three jobs, touching a marker each time, then blocks forever on a lock that
  # never comes. Once the marker goes stale the healthcheck fails, Docker declares
  # the container unhealthy, and an unhealthy transition IS an Incident — so a
  # container that is alive and stuck becomes visible without proximo guessing.
  # Unhealthy stays out of the default listing (a worker waiting on postgres is
  # unhealthy on every `compose up`): ask for it with
  # `proximo errors --service stalling`.
  stalling:
    image: alpine:3
    container_name: stalling
    command:
      - sh
      - -c
      - |
        i=1
        while [ $$i -le 3 ]; do
          touch /tmp/progress
          echo "stalling: finished job $$i"
          i=$$((i+1))
          sleep 1
        done
        echo "stalling: waiting on a lock that will never come"
        sleep 3600
    healthcheck:
      # Healthy while the marker is younger than 5s — "am I still advancing?",
      # which is the one question the project can answer and proximo cannot.
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/progress) )) -lt 5 ]"]
      interval: 3s
      timeout: 2s
      retries: 2
      start_period: 3s
    labels:
      - "proximo.transcript=true"

  # Inspection: nginx serves real HTML (whoami answers text/plain, which has
  # nothing to inject into), so the hop can insert the reporting agent before
  # </head>. Load https://inspected.test and then run `proximo errors`.
  inspected:
    image: nginx:alpine
    container_name: inspected
    labels:
      - "proximo.hosts=inspected.test"
      - "proximo.inspect=true"
