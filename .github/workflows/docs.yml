name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The agent skill quotes contracts out of docs/ verbatim. This runs in the
  # docs workflow, not in CI, because CI ignores `docs/**` — and a docs edit is
  # exactly what makes the skill drift.
  skill-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the agent skill is in sync with docs/
        run: go test ./internal/skill -run TestGeneratedBlocksMatchDocs -count=1

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Offline mode: validates relative file links and #anchor fragments
      # without touching the network — external URLs never block a PR.
      - name: Check Markdown links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --root-dir "${{ github.workspace }}" README.md CLAUDE.md docs/**/*.md
          fail: true
