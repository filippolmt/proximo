global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

entryPoints:
  # HTTP listens on :80 but does not redirect by default. A container opts in to
  # an HTTP->HTTPS redirect per host with the proximo.redirect label; the watcher
  # then writes a web-entrypoint router + redirectScheme middleware for it. A host
  # that has not opted in gets no web router (Traefik 404s its :80 requests).
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  # Routing: opt-in only. A container is routed when it sets `traefik.enable=true`
  # plus an explicit router rule, e.g.
  #   traefik.http.routers.web.rule=Host(`web.test`)
  #   traefik.http.services.web.loadbalancer.server.port=8080
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  # Dynamic config: the watcher writes one HTTP router/service file per
  # proximo-labeled container (proximo-route-*.yml) plus per-container CA-signed
  # certificates (proximo-tls.yml) here. watch:true reloads them live.
  file:
    directory: /etc/traefik/dynamic
    watch: true
