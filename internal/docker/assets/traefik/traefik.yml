global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Every route's Access record comes from here, whether or not the route is under
# Inspection — a developer learns they need a diagnosis only after the request
# they needed it for is over.
#
# stdout, not a file: the compose logging anchor already bounds and rotates this
# stream, and proximo persists nothing of its own. It is therefore the same
# stream as the operational log above; JSON is what tells the two apart, and the
# CLI filters on that. Default fields are kept as they are — they already carry
# the backend a request was served by, which is what a Transcript is looked up
# from. Headers stay dropped, as they are by default.
accessLog:
  format: json

# Built-in dashboard, read-only and local-only. api.insecure stays OFF (no
# extra port is published); the dashboard is served at https://traefik.<tld>
# by the watcher's self-route to api@internal — no static router here.
api:
  dashboard: true

entryPoints:
  # HTTP listens on :80 but does not redirect by default. A container opts in to
  # an HTTP->HTTPS redirect per host with the proximo.redirect label; the watcher
  # then writes a web-entrypoint router + redirectScheme middleware for it. A host
  # that has not opted in gets no web router (Traefik 404s its :80 requests).
  # sanitizePath keeps v3's secure default (encoded-character path normalization,
  # a path-traversal / split-view mitigation) explicit so Traefik does not log
  # the "encoded characters in the request path" startup warning. No behavior
  # change for RFC-3986-compliant backends.
  web:
    address: ":80"
    http:
      sanitizePath: true
  websecure:
    address: ":443"
    http:
      tls: {}
      sanitizePath: true

providers:
  # Routing: opt-in only. A container is routed when it sets `traefik.enable=true`
  # plus an explicit router rule, e.g.
  #   traefik.http.routers.web.rule=Host(`web.test`)
  #   traefik.http.services.web.loadbalancer.server.port=8080
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  # Dynamic config: the watcher writes one HTTP router/service file per
  # proximo-labeled container (proximo-route-*.yml) plus per-container CA-signed
  # certificates (proximo-tls.yml) here. watch:true reloads them live.
  file:
    directory: /etc/traefik/dynamic
    watch: true
